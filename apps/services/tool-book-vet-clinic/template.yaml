AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  tool-book-vet-clinic
  
  Lambda function that books a vet clinic

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x
    Architectures:
      - x86_64
    LoggingConfig:
      LogFormat: JSON

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - prod
    Description: Environment name
  
  EventPublisherStackName:
    Type: String
    Description: Name of the Event Publisher CloudFormation stack to get Events Table name
  
  EventPublisherUrl:
    Type: String
    Description: URL of the Event Publisher API endpoint for sending context events
  
  ChatHistoryTableName:
    Type: String
    Description: Name of the DynamoDB Chat History table
  
  LogLevel:
    Type: String
    Default: info
    AllowedValues:
      - error
      - warn
      - info
      - debug
    Description: Logging level

Resources:
  # SNS Topic for context events
  ContextEventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AWS::StackName}-context-events'
      DisplayName: Context Events Topic
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: tool-book-vet-clinic

  # Subscribe Event Publisher to this topic
  ContextEventsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: lambda
      TopicArn: !Ref ContextEventsTopic
      Endpoint: !ImportValue
        Fn::Sub: '${EventPublisherStackName}-FunctionArn'

  # Permission for SNS to invoke Event Publisher Lambda
  ContextEventsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !ImportValue
        Fn::Sub: '${EventPublisherStackName}-FunctionArn'
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref ContextEventsTopic

  # Lambda Function for saving context
  BookClinicFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: app.lambdaHandler
      Description: Books contextual data to session context for Bedrock Agent
      MemorySize: 256
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          EVENTS_TOPIC_ARN: !Ref ContextEventsTopic
          EVENT_PUBLISHER_URL: !Ref EventPublisherUrl
          CHAT_HISTORY_TABLE_NAME: !Ref ChatHistoryTableName
          LOG_LEVEL: !Ref LogLevel
          NODE_ENV: production
          AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
      Policies:
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt ContextEventsTopic.TopicName
        - DynamoDBCrudPolicy:
            TableName: !Ref ChatHistoryTableName

  # Permission for Bedrock Agent to invoke the Lambda function
  BedrockInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BookClinicFunction
      Action: lambda:InvokeFunction
      Principal: bedrock.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent/*'

Outputs:
  BookClinicFunction:
    Description: Book a vet clinic Lambda Function ARN
    Value: !GetAtt BookClinicFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-FunctionArn'
  
  BookClinicFunctionIamRole:
    Description: Implicit IAM Role created for Book Vet Clinic function
    Value: !GetAtt BookClinicFunctionRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-FunctionRoleArn'
  
  ContextEventsTopicArn:
    Description: SNS Topic ARN for context events
    Value: !Ref ContextEventsTopic
    Export:
      Name: !Sub '${AWS::StackName}-ContextEventsTopicArn'
  
  ContextEventsTopicName:
    Description: SNS Topic Name for context events
    Value: !GetAtt ContextEventsTopic.TopicName
    Export:
      Name: !Sub '${AWS::StackName}-ContextEventsTopicName'

