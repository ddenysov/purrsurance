version = 0.1

[default]
[default.global.parameters]
stack_name = "vet-expert-tool-book-vet-clinic"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
region = "us-east-1"
parameter_overrides = [
    "Environment=prod",
    "LogLevel=info",
    "EventPublisherStackName=vet-expert-event-publisher",
    "EventPublisherUrl=https://d7j4hmm8nj.execute-api.us-east-1.amazonaws.com/Prod/publish",
    "ChatHistoryTableName=vet-expert-service-router-ChatHistory",
    "VetAppointmentsTableName=VetAppointments"
]

[default.package.parameters]
resolve_s3 = true

[default.sync.parameters]
watch = true

[default.local_invoke.parameters]
env_vars = "env.json"

