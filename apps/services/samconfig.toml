# More information about the configuration file can be found here:
# https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-cli-config.html
version = 0.1

[default.global.parameters]
stack_name = "agent-operator-prod"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND"
confirm_changeset = true
resolve_s3 = true
s3_prefix = "agent-operator-prod"
region = "us-east-1"
disable_rollback = false
image_repositories = []
parameter_overrides = "Environment=\"prod\" BedrockAgentId=\"2QAS7CGXW9\" BedrockAgentAliasId=\"9UMT64HRVJ\" VetDocAgentName=\"VetDocAgent-Prod\" VetDocAgentFoundationModel=\"anthropic.claude-3-5-sonnet-20240620-v1:0\" VetDocAgentIdleSessionTTL=\"600\" SupervisorAgentName=\"SupervisorAgent-Prod\" SupervisorAgentFoundationModel=\"anthropic.claude-3-5-haiku-20241022-v1:0\" SupervisorAgentIdleSessionTTL=\"600\""

[default.package.parameters]
resolve_s3 = true

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
warm_containers = "EAGER"

[default.local_start_lambda.parameters]
warm_containers = "EAGER"
