[prod.deploy.parameters]
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
confirm_changeset = true
resolve_s3 = true
s3_prefix = "agent-operator-prod"
region = "us-east-1"
disable_rollback = false
parameter_overrides = "Environment=\"prod\" BedrockAgentId=\"OLHUNALEOH\" BedrockAgentAliasId=\"HCIMPAKGK2\" VetDocAgentName=\"VetDocAgent-Prod\" VetDocAgentFoundationModel=\"anthropic.claude-3-5-sonnet-20240620-v1:0\" VetDocAgentIdleSessionTTL=\"600\" SupervisorAgentName=\"SupervisorAgent-Prod\" SupervisorAgentFoundationModel=\"anthropic.claude-3-5-haiku-20241022-v1:0\" SupervisorAgentIdleSessionTTL=\"600\""
