# More information about the configuration file can be found here:
# https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-cli-config.html
version = 0.1

[default.global.parameters]
stack_name = "agent-operator"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
confirm_changeset = true
resolve_s3 = true
s3_prefix = "agent-operator"
region = "us-east-1"
disable_rollback = false
image_repositories = []
parameter_overrides = "Environment=\"dev\" BedrockAgentId=\"OLHUNALEOH\" BedrockAgentAliasId=\"TSTALIASID\" VetDocAgentName=\"VetDocAgent\" VetDocAgentFoundationModel=\"anthropic.claude-3-5-sonnet-20240620-v1:0\" VetDocAgentIdleSessionTTL=\"600\" SupervisorAgentName=\"SupervisorAgent\" SupervisorAgentFoundationModel=\"anthropic.claude-3-5-haiku-20241022-v1:0\" SupervisorAgentIdleSessionTTL=\"600\""

[default.package.parameters]
resolve_s3 = true

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
warm_containers = "EAGER"

[default.local_start_lambda.parameters]
warm_containers = "EAGER"

# Development environment configuration
[dev.global.parameters]
stack_name = "agent-operator-dev"

[dev.deploy.parameters]
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
confirm_changeset = true
resolve_s3 = true
s3_prefix = "agent-operator-dev"
region = "us-east-1"
disable_rollback = false
parameter_overrides = "Environment=\"dev\" BedrockAgentId=\"OLHUNALEOH\" BedrockAgentAliasId=\"TSTALIASID\" VetDocAgentName=\"VetDocAgent-Dev\" VetDocAgentFoundationModel=\"anthropic.claude-3-5-sonnet-20240620-v1:0\" VetDocAgentIdleSessionTTL=\"600\" SupervisorAgentName=\"SupervisorAgent-Dev\" SupervisorAgentFoundationModel=\"anthropic.claude-3-5-haiku-20241022-v1:0\" SupervisorAgentIdleSessionTTL=\"600\""

# Staging environment configuration
[staging.global.parameters]
stack_name = "agent-operator-staging"

[staging.deploy.parameters]
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
confirm_changeset = true
resolve_s3 = true
s3_prefix = "agent-operator-staging"
region = "us-east-1"
disable_rollback = false
parameter_overrides = "Environment=\"staging\" BedrockAgentId=\"OLHUNALEOH\" BedrockAgentAliasId=\"HCIMPAKGK2\" VetDocAgentName=\"VetDocAgent-Staging\" VetDocAgentFoundationModel=\"anthropic.claude-3-5-sonnet-20240620-v1:0\" VetDocAgentIdleSessionTTL=\"600\" SupervisorAgentName=\"SupervisorAgent-Staging\" SupervisorAgentFoundationModel=\"anthropic.claude-3-5-haiku-20241022-v1:0\" SupervisorAgentIdleSessionTTL=\"600\""

