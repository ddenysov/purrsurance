AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  service-router
  
  Lambda function that classifies user intentions and routes chat messages to appropriate AWS Bedrock Agents

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x
    Architectures:
      - x86_64
    LoggingConfig:
      LogFormat: JSON

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - prod
    Description: Environment name
  
  IntentionClassifierAgentId:
    Type: String
    Description: Intention Classifier Agent ID
    Default: ""
  
  IntentionClassifierAgentAliasId:
    Type: String
    Description: Intention Classifier Agent Alias ID
    Default: ""
  
  PolicyManagerAgentId:
    Type: String
    Description: Policy Manager Agent ID
    Default: ""
  
  PolicyManagerAgentAliasId:
    Type: String
    Description: Policy Manager Agent Alias ID
    Default: ""
  
  VetDocAgentId:
    Type: String
    Description: VetDoc Agent ID
    Default: ""
  
  VetDocAgentAliasId:
    Type: String
    Description: VetDoc Agent Alias ID
    Default: ""
  
  BookingManagerAgentId:
    Type: String
    Description: Booking Manager Agent ID
    Default: ""
  
  BookingManagerAgentAliasId:
    Type: String
    Description: Booking Manager Agent Alias ID
    Default: ""
  
  LogLevel:
    Type: String
    Default: info
    AllowedValues:
      - error
      - warn
      - info
      - debug
    Description: Logging level

Resources:
  # DynamoDB Table for Chat History
  ChatHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-ChatHistory'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: ttl
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: ChatHistory
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  

  ServiceRouterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: app.lambdaHandler
      Description: Classifies user intentions and routes chat messages to appropriate AWS Bedrock Agents (Policy Manager, VetDoc, etc.)
      MemorySize: 512
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          # Intention Classifier Agent
          INTENTION_CLASSIFIER_AGENT_ID: !Ref IntentionClassifierAgentId
          INTENTION_CLASSIFIER_AGENT_ALIAS_ID: !Ref IntentionClassifierAgentAliasId
          # Policy Manager Agent
          POLICY_MANAGER_AGENT_ID: !Ref PolicyManagerAgentId
          POLICY_MANAGER_AGENT_ALIAS_ID: !Ref PolicyManagerAgentAliasId
          # VetDoc Agent
          VETDOC_AGENT_ID: !Ref VetDocAgentId
          VETDOC_AGENT_ALIAS_ID: !Ref VetDocAgentAliasId
          # Booking Manager Agent
          BOOKING_MANAGER_AGENT_ID: !Ref BookingManagerAgentId
          BOOKING_MANAGER_AGENT_ALIAS_ID: !Ref BookingManagerAgentAliasId
          # Legacy support (kept for backward compatibility)
          BEDROCK_AGENT_ID: !Ref IntentionClassifierAgentId
          BEDROCK_AGENT_ALIAS_ID: !Ref IntentionClassifierAgentAliasId
          CHAT_HISTORY_TABLE_NAME: !Ref ChatHistoryTable
          LOG_LEVEL: !Ref LogLevel
          AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
      Policies:
        - Statement:
            - Sid: InvokeBedrock
              Effect: Allow
              Action:
                - bedrock:InvokeAgent
                - bedrock:InvokeModel
              Resource: '*'
        - DynamoDBCrudPolicy:
            TableName: !Ref ChatHistoryTable
      Events:
        ChatApi:
          Type: Api
          Properties:
            Path: /chat
            Method: post
            RestApiId: !Ref ServiceRouterApi
        ChatGetApi:
          Type: Api
          Properties:
            Path: /chat
            Method: get
            RestApiId: !Ref ServiceRouterApi
        OptionsApi:
          Type: Api
          Properties:
            Path: /chat
            Method: options
            RestApiId: !Ref ServiceRouterApi

  ServiceRouterApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,OPTIONS'"
        MaxAge: "'86400'"

Outputs:
  ServiceRouterApi:
    Description: API Gateway endpoint URL for Service Router
    Value: !Sub "https://${ServiceRouterApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/chat"
  
  ServiceRouterFunction:
    Description: Service Router Lambda Function ARN
    Value: !GetAtt ServiceRouterFunction.Arn
  
  ServiceRouterFunctionIamRole:
    Description: Implicit IAM Role created for Service Router function
    Value: !GetAtt ServiceRouterFunctionRole.Arn
  
  ChatHistoryTableName:
    Description: DynamoDB table name for chat history
    Value: !Ref ChatHistoryTable
    Export:
      Name: !Sub '${AWS::StackName}-ChatHistoryTableName'
  
  ChatHistoryTableArn:
    Description: DynamoDB table ARN for chat history
    Value: !GetAtt ChatHistoryTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ChatHistoryTableArn'

