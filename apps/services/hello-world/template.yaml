AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  HelloWorld Function - Chat API with Bedrock Agent integration

Globals:
  Api:
    Cors:
      AllowOrigin: "'*'"
      AllowHeaders: "'Content-Type'"
      AllowMethods: "'GET,POST,OPTIONS'"
  Function:
    Timeout: 30
    LoggingConfig:
      LogFormat: JSON

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name
  
  BedrockAgentId:
    Type: String
    Description: AWS Bedrock Agent ID
    NoEcho: true
  
  BedrockAgentAliasId:
    Type: String
    Default: TSTALIASID
    Description: AWS Bedrock Agent Alias ID
  
  ChatHistoryTableName:
    Type: String
    Description: DynamoDB Chat History Table Name

Resources:
  HelloWorldFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: app.lambdaHandler
      Runtime: nodejs20.x
      Architectures:
      - x86_64
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          BEDROCK_AGENT_ID: !Ref BedrockAgentId
          BEDROCK_AGENT_ALIAS_ID: !Ref BedrockAgentAliasId
          LOG_LEVEL: info
          ENABLE_BEDROCK_TRACE: false
          MAX_TOKENS: 2048
          CHAT_HISTORY_TABLE_NAME: !Ref ChatHistoryTableName
      Policies:
        - Statement:
            - Sid: BedrockAgentInvokePolicy 
              Effect: Allow
              Action:
                - bedrock:InvokeAgent
                - bedrock:InvokeModel
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent/*"
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent-alias/*"
        - DynamoDBCrudPolicy:
            TableName: !Ref ChatHistoryTableName
      Events:
        HelloWorld:
          Type: Api
          Properties:
            Path: /hello
            Method: post
        HelloWorldGet:
          Type: Api
          Properties:
            Path: /hello
            Method: get

Outputs:
  HelloWorldApi:
    Description: API Gateway endpoint URL for Prod stage for Hello World function
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/hello/"
  
  HelloWorldFunction:
    Description: Hello World Lambda Function ARN
    Value: !GetAtt HelloWorldFunction.Arn
  
  HelloWorldFunctionIamRole:
    Description: Implicit IAM Role created for Hello World function
    Value: !GetAtt HelloWorldFunctionRole.Arn
