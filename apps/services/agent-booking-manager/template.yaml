AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  AgentBookingManager Configuration
  
  Booking Manager Agent for Purrsurance pet insurance system - handles veterinary appointment scheduling

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - prod
    Description: Environment name

  # Reference to tool-policy-details stack to get the function ARN
  ToolPolicyDetailsStackName:
    Type: String
    Default: purrsurance-tool-policy-details
    Description: Name of the tool-policy-details stack to get GetPolicyDetailsFunction ARN

  # Reference to tool-context-get stack to get the function ARN
  ToolContextGetStackName:
    Type: String
    Default: purrsurance-tool-context-get
    Description: Name of the tool-context-get stack to get GetContextFunction ARN

  # Reference to tool-context-save stack to get the function ARN
  ToolContextSaveStackName:
    Type: String
    Default: purrsurance-tool-context-save
    Description: Name of the tool-context-save stack to get SaveContextFunction ARN

  # AgentBookingManager Configuration
  BookingManagerAgentName:
    Type: String
    Default: AgentBookingManager
    Description: Name for the Booking Manager Agent
  
  BookingManagerAgentFoundationModel:
    Type: String
    Default: us.anthropic.claude-3-5-haiku-20241022-v1:0
    Description: Foundation model for AgentBookingManager (Claude 3.5 Haiku for efficient conversation)
    AllowedValues:
      - us.anthropic.claude-3-5-haiku-20241022-v1:0

  BookingManagerAgentInstruction:
    Type: String
    Default: |
      You are a helpful appointment booking assistant for Purrsurance pet insurance. Your role is to help users schedule veterinary appointments for their pets.
      
      MANDATORY FIRST STEP: Always start by using GetPolicyDetails tool to retrieve owner and pet information. Get policy ID from session attributes or ask user for it. Use this information throughout the conversation - NEVER ask for information already available in GetPolicyDetails (owner name, pet name, breed, age, medical history, address).
      
      Help users by:
      1. Using GetPolicyDetails to get complete owner and pet information, then addressing owner by name
      2. Gathering only missing appointment details (reason for visit, preferred date and time)
      3. Using the FindVetClinic tool to find suitable veterinary clinics (use owner's address from GetPolicyDetails as default location)
      4. Leveraging medical history from GetPolicyDetails to provide informed recommendations
      5. Confirming all appointment details before finalizing the booking
      6. Providing next steps and preparation requirements based on pet's medical history
      
      For emergency situations (severe symptoms like difficulty breathing, severe bleeding, seizures), immediately use FindVetClinic with urgency="urgent" to find emergency care options and recommend immediate veterinary attention.
      
      Always be friendly, empathetic, professional, personalized, and prioritize the pet's safety above all else.

    Description: System instruction/prompt for AgentBookingManager (default instruction, can override with deploy.sh + instruction.txt)
  
  BookingManagerAgentIdleSessionTTL:
    Type: Number
    Default: 900
    MinValue: 60
    MaxValue: 3600
    Description: Idle session timeout in seconds for AgentBookingManager (60-3600)

Resources:
  # IAM Role for the Booking Manager Agent
  BookingManagerAgentRole:
    Type: AWS::IAM::Role
    Properties:
      Description: IAM role for AgentBookingManager to invoke Bedrock foundation models and Lambda functions
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent/*'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonBedrockFullAccess
      Policies:
        - PolicyName: BedrockModelInvokePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/*'
        - PolicyName: LambdaInvokePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:*'
        - PolicyName: InvokePolicyDetailsFunction
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - Fn::ImportValue:
                      !Sub '${ToolPolicyDetailsStackName}-FunctionArn'
        - PolicyName: InvokeContextGetFunction
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - Fn::ImportValue:
                      !Sub '${ToolContextGetStackName}-FunctionArn'
        - PolicyName: InvokeContextSaveFunction
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - Fn::ImportValue:
                      !Sub '${ToolContextSaveStackName}-FunctionArn'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Agent
          Value: AgentBookingManager
        - Key: Role
          Value: AppointmentScheduling

  # The Bedrock Agent
  BookingManagerAgent:
    Type: AWS::Bedrock::Agent
    Properties:
      AgentName: !Ref BookingManagerAgentName
      Description: Booking manager agent for veterinary appointment scheduling
      AgentResourceRoleArn: !GetAtt BookingManagerAgentRole.Arn
      FoundationModel: !Ref BookingManagerAgentFoundationModel
      Instruction: !Ref BookingManagerAgentInstruction
      IdleSessionTTLInSeconds: !Ref BookingManagerAgentIdleSessionTTL
      AutoPrepare: true
      Tags:
        Environment: !Ref Environment
        Service: AgentBookingManager
        ManagedBy: SAM
        Purpose: AppointmentScheduling

  PolicyDetailsLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: 
        Fn::ImportValue:
          !Sub '${ToolPolicyDetailsStackName}-FunctionArn'
      Action: lambda:InvokeFunction
      Principal: bedrock.amazonaws.com
      SourceArn: !GetAtt BookingManagerAgent.AgentArn

  # Permission for Bedrock Agent to invoke the GetContext Lambda function
  GetContextLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: 
        Fn::ImportValue:
          !Sub '${ToolContextGetStackName}-FunctionArn'
      Action: lambda:InvokeFunction
      Principal: bedrock.amazonaws.com
      SourceArn: !GetAtt BookingManagerAgent.AgentArn

  # Permission for Bedrock Agent to invoke the SaveContext Lambda function
  SaveContextLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: 
        Fn::ImportValue:
          !Sub '${ToolContextSaveStackName}-FunctionArn'
      Action: lambda:InvokeFunction
      Principal: bedrock.amazonaws.com
      SourceArn: !GetAtt BookingManagerAgent.AgentArn

  # Agent Alias
  BookingManagerAgentAlias:
    Type: AWS::Bedrock::AgentAlias
    Properties:
      AgentId: !Ref BookingManagerAgent
      AgentAliasName: !Sub '${Environment}-booking-manager-alias'
      Description: !Sub 'Booking manager agent alias for ${Environment} environment'
      Tags:
        Environment: !Ref Environment
        Agent: AgentBookingManager
        Role: AppointmentScheduling

Outputs:
  BookingManagerAgentId:
    Description: "AgentBookingManager Bedrock Agent ID"
    Value: !Ref BookingManagerAgent
    Export:
      Name: !Sub '${AWS::StackName}-BookingManagerAgentId'
  
  BookingManagerAgentAliasId:
    Description: "AgentBookingManager Alias ID"
    Value: !GetAtt BookingManagerAgentAlias.AgentAliasId
    Export:
      Name: !Sub '${AWS::StackName}-BookingManagerAgentAliasId'
  
  BookingManagerAgentArn:
    Description: "AgentBookingManager ARN"
    Value: !GetAtt BookingManagerAgent.AgentArn
    Export:
      Name: !Sub '${AWS::StackName}-BookingManagerAgentArn'
  
  BookingManagerAgentRoleArn:
    Description: "AgentBookingManager IAM Role ARN"
    Value: !GetAtt BookingManagerAgentRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-BookingManagerAgentRoleArn'


