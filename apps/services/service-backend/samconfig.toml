version = 0.1

[default.global.parameters]
stack_name = "service-backend"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
resolve_s3 = true
region = "us-east-1"
parameter_overrides = [
    "Environment=prod",
    "VetAppointmentsTableName=VetAppointments",
    "LogLevel=info"
]

