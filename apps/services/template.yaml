AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  agent-operator

  Sample SAM Template for agent-operator

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Api:
    Cors:
      AllowOrigin: "'*'"
      AllowHeaders: "'Content-Type'"
      AllowMethods: "'GET,POST,OPTIONS'"
  Function:
    Timeout: 30

    # You can add LoggingConfig parameters such as the Logformat, Log Group, and SystemLogLevel or ApplicationLogLevel. Learn more here https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-function.html#sam-function-loggingconfig.
    LoggingConfig:
      LogFormat: JSON

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name
  
  BedrockAgentId:
    Type: String
    Description: AWS Bedrock Agent ID
    NoEcho: true
  
  BedrockAgentAliasId:
    Type: String
    Default: TSTALIASID
    Description: AWS Bedrock Agent Alias ID

  # VetDocAgent Configuration
  VetDocAgentName:
    Type: String
    Default: VetDocAgent
    Description: Name for the Veterinary Documentation Agent
  
  VetDocAgentFoundationModel:
    Type: String
    Default: anthropic.claude-3-5-sonnet-20240620-v1:0
    Description: Foundation model for VetDocAgent (Claude Sonnet 3.5)
    AllowedValues:
      - us.anthropic.claude-3-5-sonnet-20241022-v2:0
      - anthropic.claude-3-5-sonnet-20240620-v1:0
      - anthropic.claude-3-sonnet-20240229-v1:0
  
  VetDocAgentInstruction:
    Type: String
    Default: |
      You are VetDocAgent, a specialized veterinary documentation assistant for Purrsurance pet insurance.
      
      Your role is to help veterinarians and pet insurance agents with:
      - Medical documentation and record-keeping
      - Insurance policy explanations
      - Claims processing guidance
      - Veterinary medical knowledge
      - Pet health information
      
      Always provide accurate, professional, and helpful information.
      When discussing medical topics, remind users to consult with licensed veterinarians for specific cases.
      For insurance-related questions, reference policy documents and standard procedures.
    Description: System instruction/prompt for VetDocAgent
  
  VetDocAgentIdleSessionTTL:
    Type: Number
    Default: 600
    MinValue: 60
    MaxValue: 3600
    Description: Idle session timeout in seconds (60-3600)
Resources:
  EventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: ApplicationEventsTopic

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: "partitionKey"
          AttributeType: "S"
        - AttributeName: "timestamp"
          AttributeType: "N"
      KeySchema:
        - AttributeName: "partitionKey"
          KeyType: "HASH"
        - AttributeName: "timestamp"
          KeyType: "RANGE"
      BillingMode: PAY_PER_REQUEST

  ChatHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-ChatHistory'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: ChatHistory

    # 3. Функция-Продюсер: Отправляет событие в SNS
    # (Для примера, будет вызываться через API Gateway)
  EventProducerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: producer/
      Handler: app.handler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      Environment:
        Variables:
          EVENTS_TOPIC_ARN: !Ref EventsTopic
      Policies:
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt EventsTopic.TopicName
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /publish
            Method: post

  # 4. Функция-Сохранялка: Сохраняет событие из SNS в DynamoDB
  EventSaverFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: saver/
      Handler: app.handler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      Environment:
        Variables:
          EVENTS_TABLE_NAME: !Ref EventsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
      Events:
        SNSEvent:
          Type: SNS
          Properties:
            Topic: !Ref EventsTopic


  HelloWorldFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: hello-world/
      Handler: app.lambdaHandler
      Runtime: nodejs20.x
      Architectures:
      - x86_64
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          BEDROCK_AGENT_ID: !Ref BedrockAgentId
          BEDROCK_AGENT_ALIAS_ID: !Ref BedrockAgentAliasId
          LOG_LEVEL: info
          ENABLE_BEDROCK_TRACE: false
          MAX_TOKENS: 2048
          CHAT_HISTORY_TABLE_NAME: !Ref ChatHistoryTable
      Policies:
        - Statement:
            - Sid: BedrockAgentInvokePolicy 
              Effect: Allow
              Action:
                - bedrock:InvokeAgent
                - bedrock:InvokeModel
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent/*"
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent-alias/*"
        - DynamoDBCrudPolicy:
            TableName: !Ref ChatHistoryTable
      Events:
        HelloWorld:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /hello
            Method: post
        HelloWorldGet:
          Type: Api
          Properties:
            Path: /hello
            Method: get

  GetPolicyDetailsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: get-policy-details/
      Handler: app.lambdaHandler
      Runtime: nodejs22.x
      Architectures:
      - x86_64
      Environment:
        Variables:
          EVENTS_TOPIC_ARN: !Ref EventsTopic
      Policies:
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt EventsTopic.TopicName
      Events:
        GetPolicyDetails:
          Type: Api
          Properties:
            Path: /policy
            Method: get

  SSEStreamFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: sse-stream/
      Handler: app.lambdaHandler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          LOG_LEVEL: info
          SSE_EVENT_INTERVAL: 5000
          SSE_MAX_DURATION: 300000
          SSE_KEEPALIVE_INTERVAL: 30000
          EVENTS_TABLE_NAME: !Ref EventsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM
        Cors:
          AllowOrigins:
            - "*"
          AllowMethods:
            - GET
          AllowHeaders:
            - "*"
          MaxAge: 600
      Events:
        HttpApiEvent:
          Type: HttpApi
          Properties:
            Path: /stream
            Method: GET
            TimeoutInMillis: 300000
            PayloadFormatVersion: "2.0"
            ApiId: !Ref SSEHttpApi

  GetChatHistoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: get-chat-history/
      Handler: app.lambdaHandler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      Timeout: 10
      MemorySize: 256
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ChatHistoryTable
      Environment:
        Variables:
          CHAT_HISTORY_TABLE_NAME: !Ref ChatHistoryTable
          ENVIRONMENT: !Ref Environment
      Events:
        GetChatHistory:
          Type: Api
          Properties:
            Path: /chat-history
            Method: get

  VetDocAgentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-VetDocAgentRole'
      Description: IAM role for VetDocAgent to invoke Bedrock foundation models
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent/*'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonBedrockFullAccess
      Policies:
        - PolicyName: BedrockModelInvokePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-*'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Agent
          Value: VetDocAgent

  VetDocAgent:
    Type: AWS::Bedrock::Agent
    Properties:
      AgentName: !Ref VetDocAgentName
      Description: Veterinary documentation assistant for Purrsurance pet insurance
      AgentResourceRoleArn: !GetAtt VetDocAgentRole.Arn
      FoundationModel: !Ref VetDocAgentFoundationModel
      Instruction: !Ref VetDocAgentInstruction
      IdleSessionTTLInSeconds: !Ref VetDocAgentIdleSessionTTL
      AutoPrepare: true
      Tags:
        Environment: !Ref Environment
        Service: VetDocAgent
        ManagedBy: SAM

  VetDocAgentAlias:
    Type: AWS::Bedrock::AgentAlias
    Properties:
      AgentId: !Ref VetDocAgent
      AgentAliasName: !Sub '${Environment}-alias'
      Description: !Sub 'Agent alias for ${Environment} environment'
      Tags:
        Environment: !Ref Environment
        Agent: VetDocAgent

  SSEHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - OPTIONS
        AllowHeaders:
          - "*"
        MaxAge: 600

  BedrockInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt GetPolicyDetailsFunction.Arn
      Principal: bedrock.amazonaws.com
      # Теперь SourceArn ссылается на ARN агента, созданного в этом же шаблоне
      SourceArn: arn:aws:bedrock:us-east-1:057367573361:agent/OLHUNALEOH

  ApplicationResourceGroup:
    Type: AWS::ResourceGroups::Group
    Properties:
      Name:
        Fn::Sub: ApplicationInsights-SAM-${AWS::StackName}
      ResourceQuery:
        Type: CLOUDFORMATION_STACK_1_0
  ApplicationInsightsMonitoring:
    Type: AWS::ApplicationInsights::Application
    Properties:
      ResourceGroupName:
        Ref: ApplicationResourceGroup
      AutoConfigurationEnabled: 'true'
Outputs:
  # ServerlessRestApi is an implicit API created out of Events key under Serverless::Function
  # Find out more about other implicit resources you can reference within SAM
  # https://github.com/awslabs/serverless-application-model/blob/master/docs/internals/generated_resources.rst#api
  HelloWorldApi:
    Description: API Gateway endpoint URL for Prod stage for Hello World 
      function
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/hello/"
  HelloWorldFunction:
    Description: Hello World Lambda Function ARN
    Value: !GetAtt HelloWorldFunction.Arn
  HelloWorldFunctionIamRole:
    Description: Implicit IAM Role created for Hello World function
    Value: !GetAtt HelloWorldFunctionRole.Arn
  GetPolicyDetailsApi:
    Description: API Gateway endpoint URL for Prod stage for GetPolicyDetails function
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/policy/"
  GetPolicyDetailsFunction:
    Description: GetPolicyDetails Lambda Function ARN
    Value: !GetAtt GetPolicyDetailsFunction.Arn
  GetPolicyDetailsFunctionIamRole:
    Description: Implicit IAM Role created for GetPolicyDetails function
    Value: !GetAtt GetPolicyDetailsFunctionRole.Arn
  
  SSEStreamFunctionUrl:
    Description: "SSE Stream Lambda Function URL"
    Value: !GetAtt SSEStreamFunctionUrl.FunctionUrl
  
  SSEStreamHttpApiUrl:
    Description: "SSE Stream HTTP API Gateway URL"
    Value: !Sub "https://${SSEHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/stream"
  
  SSEStreamFunction:
    Description: "SSE Stream Lambda Function ARN"
    Value: !GetAtt SSEStreamFunction.Arn

  EventProducerApi:
    Description: "API Gateway endpoint URL to publish events"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/publish"
  
  EventSaverFunction:
    Description: "Event Saver Lambda Function ARN"
    Value: !GetAtt EventSaverFunction.Arn
  
  EventsTableName:
    Description: "DynamoDB Events Table Name"
    Value: !Ref EventsTable
  
  ChatHistoryTableName:
    Description: "Chat History DynamoDB Table Name"
    Value: !Ref ChatHistoryTable
  
  ChatHistoryTableArn:
    Description: "Chat History DynamoDB Table ARN"
    Value: !GetAtt ChatHistoryTable.Arn
  
  GetChatHistoryApi:
    Description: "API Gateway endpoint URL for GetChatHistory function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/chat-history/"
  
  GetChatHistoryFunction:
    Description: "GetChatHistory Lambda Function ARN"
    Value: !GetAtt GetChatHistoryFunction.Arn

  VetDocAgentId:
    Description: "VetDocAgent Bedrock Agent ID"
    Value: !Ref VetDocAgent
    Export:
      Name: !Sub '${AWS::StackName}-VetDocAgentId'
  
  VetDocAgentAliasId:
    Description: "VetDocAgent Alias ID"
    Value: !GetAtt VetDocAgentAlias.AgentAliasId
    Export:
      Name: !Sub '${AWS::StackName}-VetDocAgentAliasId'
  
  VetDocAgentArn:
    Description: "VetDocAgent ARN"
    Value: !GetAtt VetDocAgent.AgentArn
    Export:
      Name: !Sub '${AWS::StackName}-VetDocAgentArn'
  
  VetDocAgentRoleArn:
    Description: "VetDocAgent IAM Role ARN"
    Value: !GetAtt VetDocAgentRole.Arn
