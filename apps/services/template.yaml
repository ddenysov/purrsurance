AWSTemplateFormatVersion: '2010-09-09' # Version of CloudFormation template format
Transform: AWS::Serverless-2016-10-31 # SAM (Serverless Application Model) transformation macro
Description: > # Description of the CloudFormation stack
  agent-operator

  Sample SAM Template for agent-operator

# Global configuration that applies to all resources of specified type
# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Api: # Global settings for all API Gateway endpoints
    Cors: # Cross-Origin Resource Sharing settings
      AllowOrigin: "'*'" # Allow requests from any origin (domain)
      AllowHeaders: "'Content-Type'" # Allow Content-Type header in requests
      AllowMethods: "'GET,POST,OPTIONS'" # Allow these HTTP methods
  Function: # Global settings for all Lambda functions
    Timeout: 30 # Maximum execution time in seconds for Lambda functions

    # Logging configuration for Lambda functions
    # You can add LoggingConfig parameters such as the Logformat, Log Group, and SystemLogLevel or ApplicationLogLevel. Learn more here https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-function.html#sam-function-loggingconfig.
    LoggingConfig:
      LogFormat: JSON # Log format: JSON for structured logs, Text for plain text logs

Parameters: # Input parameters that can be passed when deploying the stack
  Environment: # Environment identifier (prod)
    Type: String # Parameter type: string value
    Default: prod # Default value if not specified during deployment
    AllowedValues: # List of valid values for this parameter
      - prod # Production environment
    Description: Environment name # Human-readable description of the parameter
  
  BedrockAgentId: # AWS Bedrock Agent unique identifier
    Type: String # Parameter type: string value
    Description: AWS Bedrock Agent ID # Human-readable description
    NoEcho: true # Hide this value in CloudFormation console for security (sensitive data)
  
  BedrockAgentAliasId: # AWS Bedrock Agent Alias identifier
    Type: String # Parameter type: string value
    Default: TSTALIASID # Default test alias ID
    Description: AWS Bedrock Agent Alias ID # Human-readable description


Resources: # AWS resources to be created by this template
  # VetDocAgent - deployed as separate nested CloudFormation stack
  VetDocAgentStack: # Veterinary documentation agent stack
    Type: AWS::CloudFormation::Stack # Nested CloudFormation stack resource type
    Properties:
      TemplateURL: ./vetdoc-agent/template.yaml # Path to the nested stack template file
      Parameters: # Parameters to pass to the nested stack
        Environment: !Ref Environment # Pass Environment parameter value to nested stack

  # SupervisorAgent - deployed as separate nested CloudFormation stack
  SupervisorAgentStack: # Supervisor agent stack for orchestrating other agents
    Type: AWS::CloudFormation::Stack # Nested CloudFormation stack resource type
    Properties:
      TemplateURL: ./supervisor-agent/template.yaml # Path to the nested stack template file
      Parameters: # Parameters to pass to the nested stack
        Environment: !Ref Environment # Pass Environment parameter value to nested stack

  EventsTopic: # SNS Topic for publishing application events
    Type: AWS::SNS::Topic # Simple Notification Service Topic resource type
    Properties:
      DisplayName: ApplicationEventsTopic # Human-readable name displayed in AWS console

  EventsTable: # DynamoDB table for storing application events
    Type: AWS::DynamoDB::Table # DynamoDB Table resource type
    Properties:
      AttributeDefinitions: # Definitions of table attributes (only key attributes need to be defined)
        - AttributeName: "partitionKey" # Partition key attribute name
          AttributeType: "S" # String data type
        - AttributeName: "timestamp" # Sort key attribute name (for time-based sorting)
          AttributeType: "N" # Number data type
      KeySchema: # Primary key schema definition
        - AttributeName: "partitionKey" # Partition key (HASH) - used to distribute data across partitions
          KeyType: "HASH" # Partition key type
        - AttributeName: "timestamp" # Sort key (RANGE) - used to sort items within a partition
          KeyType: "RANGE" # Sort key type
      BillingMode: PAY_PER_REQUEST # Billing mode: pay only for actual read/write requests (no provisioned capacity)

  ChatHistoryTable: # DynamoDB table for storing chat conversation history
    Type: AWS::DynamoDB::Table # DynamoDB Table resource type
    Properties:
      TableName: !Sub '${AWS::StackName}-ChatHistory' # Table name with stack name prefix for uniqueness
      BillingMode: PAY_PER_REQUEST # Billing mode: pay per request (on-demand pricing)
      AttributeDefinitions: # Definitions of table attributes (only key attributes)
        - AttributeName: sessionId # Session identifier attribute
          AttributeType: S # String data type
        - AttributeName: timestamp # Message timestamp attribute
          AttributeType: N # Number data type
      KeySchema: # Primary key schema
        - AttributeName: sessionId # Partition key - groups messages by session
          KeyType: HASH # Partition key type
        - AttributeName: timestamp # Sort key - orders messages chronologically within session
          KeyType: RANGE # Sort key type
      TimeToLiveSpecification: # Automatic item deletion after expiration
        AttributeName: ttl # Name of the TTL attribute in items
        Enabled: true # Enable automatic deletion of expired items
      PointInTimeRecoverySpecification: # Backup configuration
        PointInTimeRecoveryEnabled: true # Enable continuous backups for point-in-time recovery
      Tags: # Resource tags for organization and cost allocation
        - Key: Environment # Tag key
          Value: !Ref Environment # Tag value from parameter
        - Key: Service # Tag key
          Value: ChatHistory # Tag value describing the service

    # 3. Event Producer Function: Publishes events to SNS Topic
    # (Example: triggered via API Gateway)
  EventProducerFunction: # Lambda function for publishing events
    Type: AWS::Serverless::Function # SAM serverless function resource type
    Properties:
      CodeUri: producer/ # Path to the function code directory
      Handler: app.handler # Entry point: file.function (app.js exports handler function)
      Runtime: nodejs20.x # Node.js 20.x runtime environment
      Architectures: # Processor architecture
        - x86_64 # 64-bit x86 architecture (Intel/AMD)
      Environment: # Environment variables accessible in function code
        Variables:
          EVENTS_TOPIC_ARN: !Ref EventsTopic # ARN of the SNS topic to publish events to
      Policies: # IAM policies granting permissions to the function
        - SNSPublishMessagePolicy: # Managed policy for publishing to SNS
            TopicName: !GetAtt EventsTopic.TopicName # Topic name to publish to
      Events: # Event sources that trigger this function
        ApiEvent: # API Gateway event source
          Type: Api # API Gateway REST API event type
          Properties:
            Path: /publish # API endpoint path
            Method: post # HTTP method (POST)

  # 4. Event Saver Function: Saves events from SNS to DynamoDB
  EventSaverFunction: # Lambda function that saves events to database
    Type: AWS::Serverless::Function # SAM serverless function resource type
    Properties:
      CodeUri: saver/ # Path to the function code directory
      Handler: app.handler # Entry point: file.function (app.js exports handler function)
      Runtime: nodejs20.x # Node.js 20.x runtime environment
      Architectures: # Processor architecture
        - x86_64 # 64-bit x86 architecture (Intel/AMD)
      Environment: # Environment variables accessible in function code
        Variables:
          EVENTS_TABLE_NAME: !Ref EventsTable # Name of DynamoDB table to save events to
      Policies: # IAM policies granting permissions
        - DynamoDBCrudPolicy: # Managed policy for DynamoDB CRUD operations (Create, Read, Update, Delete)
            TableName: !Ref EventsTable # Table name to grant access to
      Events: # Event sources that trigger this function
        SNSEvent: # SNS event source
          Type: SNS # SNS topic subscription event type
          Properties:
            Topic: !Ref EventsTopic # ARN of SNS topic to subscribe to


  # HelloWorld - deployed as separate nested stack
  HelloWorldStack: # Main chat handler stack with Bedrock integration
    Type: AWS::CloudFormation::Stack # Nested CloudFormation stack resource type
    Properties:
      TemplateURL: ./hello-world/template.yaml # Path to the nested stack template file
      Parameters: # Parameters passed to nested stack
        Environment: !Ref Environment # Environment name (dev/staging/prod)
        BedrockAgentId: !Ref BedrockAgentId # Bedrock Agent ID for AI interactions
        BedrockAgentAliasId: !Ref BedrockAgentAliasId # Bedrock Agent Alias ID
        ChatHistoryTableName: !Ref ChatHistoryTable # DynamoDB table name for storing chat history

  GetPolicyDetailsFunction: # Lambda function to retrieve policy details
    Type: AWS::Serverless::Function # SAM serverless function resource type
    Properties:
      CodeUri: get-policy-details/ # Path to the function code directory
      Handler: app.lambdaHandler # Entry point: file.function (app.js exports lambdaHandler)
      Runtime: nodejs22.x # Node.js 22.x runtime environment
      Architectures: # Processor architecture
      - x86_64 # 64-bit x86 architecture (Intel/AMD)
      Environment: # Environment variables accessible in function code
        Variables:
          EVENTS_TOPIC_ARN: !Ref EventsTopic # ARN of SNS topic for publishing events
      Policies: # IAM policies granting permissions
        - SNSPublishMessagePolicy: # Managed policy for publishing to SNS
            TopicName: !GetAtt EventsTopic.TopicName # Topic name to publish to
      Events: # Event sources that trigger this function
        GetPolicyDetails: # API Gateway event
          Type: Api # API Gateway REST API event type
          Properties:
            Path: /policy # API endpoint path
            Method: get # HTTP method (GET)

  SSEStreamFunction: # Lambda function for Server-Sent Events (SSE) streaming
    Type: AWS::Serverless::Function # SAM serverless function resource type
    Properties:
      CodeUri: sse-stream/ # Path to the function code directory
      Handler: app.lambdaHandler # Entry point: file.function (app.js exports lambdaHandler)
      Runtime: nodejs20.x # Node.js 20.x runtime environment
      Architectures: # Processor architecture
        - x86_64 # 64-bit x86 architecture (Intel/AMD)
      Timeout: 300 # Maximum execution time in seconds (5 minutes)
      MemorySize: 512 # Memory allocation in MB (affects CPU allocation too)
      Environment: # Environment variables accessible in function code
        Variables:
          ENVIRONMENT: !Ref Environment # Current environment name
          LOG_LEVEL: info # Logging verbosity level (error/warn/info/debug)
          SSE_EVENT_INTERVAL: 5000 # Interval between SSE events in milliseconds (5 seconds)
          SSE_MAX_DURATION: 300000 # Maximum streaming duration in milliseconds (5 minutes)
          SSE_KEEPALIVE_INTERVAL: 30000 # Keepalive ping interval in milliseconds (30 seconds)
          EVENTS_TABLE_NAME: !Ref EventsTable # DynamoDB table name for reading events
      Policies: # IAM policies granting permissions
        - DynamoDBReadPolicy: # Managed policy for DynamoDB read operations
            TableName: !Ref EventsTable # Table name to grant read access to
      FunctionUrlConfig: # Lambda Function URL configuration (direct public HTTP access)
        AuthType: NONE # No authentication required (public access)
        InvokeMode: RESPONSE_STREAM # Enable response streaming mode for SSE
        Cors: # Cross-Origin Resource Sharing settings
          AllowOrigins: # List of allowed origins
            - "*" # Allow requests from any origin
          AllowMethods: # Allowed HTTP methods
            - GET # Only GET method allowed
          AllowHeaders: # Allowed request headers
            - "*" # Allow any headers
          MaxAge: 600 # Browser cache duration for CORS preflight in seconds (10 minutes)
      Events: # Event sources that trigger this function
        HttpApiEvent: # HTTP API event source
          Type: HttpApi # HTTP API event type (v2)
          Properties:
            Path: /stream # API endpoint path
            Method: GET # HTTP method (GET)
            TimeoutInMillis: 300000 # API Gateway timeout in milliseconds (5 minutes)
            PayloadFormatVersion: "2.0" # HTTP API payload format version
            ApiId: !Ref SSEHttpApi # Reference to HTTP API Gateway

  GetChatHistoryFunction: # Lambda function to retrieve chat conversation history
    Type: AWS::Serverless::Function # SAM serverless function resource type
    Properties:
      CodeUri: get-chat-history/ # Path to the function code directory
      Handler: app.lambdaHandler # Entry point: file.function (app.js exports lambdaHandler)
      Runtime: nodejs20.x # Node.js 20.x runtime environment
      Architectures: # Processor architecture
        - x86_64 # 64-bit x86 architecture (Intel/AMD)
      Timeout: 10 # Maximum execution time in seconds
      MemorySize: 256 # Memory allocation in MB
      Policies: # IAM policies granting permissions
        - DynamoDBReadPolicy: # Managed policy for DynamoDB read operations
            TableName: !Ref ChatHistoryTable # Table name to grant read access to
      Environment: # Environment variables accessible in function code
        Variables:
          CHAT_HISTORY_TABLE_NAME: !Ref ChatHistoryTable # DynamoDB table name for reading chat history
          ENVIRONMENT: !Ref Environment # Current environment name
      Events: # Event sources that trigger this function
        GetChatHistory: # API Gateway event
          Type: Api # API Gateway REST API event type
          Properties:
            Path: /chat-history # API endpoint path
            Method: get # HTTP method (GET)

  SSEHttpApi: # HTTP API Gateway for SSE streaming (version 2)
    Type: AWS::Serverless::HttpApi # SAM HTTP API resource type
    Properties:
      CorsConfiguration: # Cross-Origin Resource Sharing settings
        AllowOrigins: # List of allowed origins
          - "*" # Allow requests from any origin
        AllowMethods: # Allowed HTTP methods
          - GET # GET method
          - OPTIONS # OPTIONS method for CORS preflight
        AllowHeaders: # Allowed request headers
          - "*" # Allow any headers
        MaxAge: 600 # Browser cache duration for CORS preflight in seconds (10 minutes)

  BedrockInvokePermission: # Permission for Bedrock to invoke Lambda function
    Type: AWS::Lambda::Permission # Lambda permission resource type
    Properties:
      Action: lambda:InvokeFunction # Permission to invoke the function
      FunctionName: !GetAtt GetPolicyDetailsFunction.Arn # ARN of function to grant permission to
      Principal: bedrock.amazonaws.com # AWS Bedrock service principal
      # SourceArn references the Bedrock agent created in the same template
      SourceArn: arn:aws:bedrock:us-east-1:057367573361:agent/2QAS7CGXW9 # ARN of Bedrock agent allowed to invoke

  ApplicationResourceGroup: # Resource group for organizing related resources
    Type: AWS::ResourceGroups::Group # Resource Groups resource type
    Properties:
      Name: # Name of the resource group
        Fn::Sub: ApplicationInsights-SAM-${AWS::StackName} # Name includes stack name for uniqueness
      ResourceQuery: # Query to define which resources belong to this group
        Type: CLOUDFORMATION_STACK_1_0 # Query type: all resources in CloudFormation stack
  ApplicationInsightsMonitoring: # Application Insights monitoring configuration
    Type: AWS::ApplicationInsights::Application # Application Insights resource type
    Properties:
      ResourceGroupName: # Name of resource group to monitor
        Ref: ApplicationResourceGroup # Reference to resource group created above
      AutoConfigurationEnabled: 'true' # Automatically configure monitoring for supported resources

Outputs: # Output values that can be imported by other stacks or displayed after deployment
  # ServerlessRestApi is an implicit API created out of Events key under Serverless::Function
  # Find out more about other implicit resources you can reference within SAM
  # https://github.com/awslabs/serverless-application-model/blob/master/docs/internals/generated_resources.rst#api
  HelloWorldApi: # API Gateway endpoint for HelloWorld function
    Description: API Gateway endpoint URL for Prod stage for Hello World function # Human-readable description
    Value: !GetAtt HelloWorldStack.Outputs.HelloWorldApi # Get output value from nested stack

  HelloWorldFunction: # ARN of HelloWorld Lambda function
    Description: Hello World Lambda Function ARN # Human-readable description
    Value: !GetAtt HelloWorldStack.Outputs.HelloWorldFunction # Get output value from nested stack

  HelloWorldFunctionIamRole: # IAM Role for HelloWorld function
    Description: Implicit IAM Role created for Hello World function # Human-readable description
    Value: !GetAtt HelloWorldStack.Outputs.HelloWorldFunctionIamRole # Get output value from nested stack
  
  GetPolicyDetailsApi: # API Gateway endpoint for GetPolicyDetails function
    Description: API Gateway endpoint URL for Prod stage for GetPolicyDetails function # Human-readable description
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/policy/" # Construct URL from variables
  GetPolicyDetailsFunction: # ARN of GetPolicyDetails Lambda function
    Description: GetPolicyDetails Lambda Function ARN # Human-readable description
    Value: !GetAtt GetPolicyDetailsFunction.Arn # Get ARN attribute of the function
  GetPolicyDetailsFunctionIamRole: # IAM Role for GetPolicyDetails function
    Description: Implicit IAM Role created for GetPolicyDetails function # Human-readable description
    Value: !GetAtt GetPolicyDetailsFunctionRole.Arn # Get ARN of the function's IAM role
  
  SSEStreamFunctionUrl: # Direct Lambda Function URL for SSE streaming
    Description: "SSE Stream Lambda Function URL" # Human-readable description
    Value: !GetAtt SSEStreamFunctionUrl.FunctionUrl # Get the Function URL from the URL configuration
  
  SSEStreamHttpApiUrl: # HTTP API Gateway URL for SSE streaming
    Description: "SSE Stream HTTP API Gateway URL" # Human-readable description
    Value: !Sub "https://${SSEHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/stream" # Construct URL with API ID and region
  
  SSEStreamFunction: # ARN of SSE Stream Lambda function
    Description: "SSE Stream Lambda Function ARN" # Human-readable description
    Value: !GetAtt SSEStreamFunction.Arn # Get ARN attribute of the function

  EventProducerApi: # API Gateway endpoint for publishing events
    Description: "API Gateway endpoint URL to publish events" # Human-readable description
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/publish" # Construct URL
  
  EventSaverFunction: # ARN of Event Saver Lambda function
    Description: "Event Saver Lambda Function ARN" # Human-readable description
    Value: !GetAtt EventSaverFunction.Arn # Get ARN attribute of the function
  
  EventsTableName: # Name of DynamoDB Events table
    Description: "DynamoDB Events Table Name" # Human-readable description
    Value: !Ref EventsTable # Get the table name (returns table name as string)
  
  ChatHistoryTableName: # Name of DynamoDB Chat History table
    Description: "Chat History DynamoDB Table Name" # Human-readable description
    Value: !Ref ChatHistoryTable # Get the table name (returns table name as string)
  
  ChatHistoryTableArn: # ARN of DynamoDB Chat History table
    Description: "Chat History DynamoDB Table ARN" # Human-readable description
    Value: !GetAtt ChatHistoryTable.Arn # Get ARN attribute of the table
  
  GetChatHistoryApi: # API Gateway endpoint for retrieving chat history
    Description: "API Gateway endpoint URL for GetChatHistory function" # Human-readable description
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/chat-history/" # Construct URL
  
  GetChatHistoryFunction: # ARN of GetChatHistory Lambda function
    Description: "GetChatHistory Lambda Function ARN" # Human-readable description
    Value: !GetAtt GetChatHistoryFunction.Arn # Get ARN attribute of the function


