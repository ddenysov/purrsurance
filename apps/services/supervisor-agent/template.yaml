AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  SupervisorAgent Configuration
  
  Supervisor/Router Agent for Purrsurance pet insurance system

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name

  # SupervisorAgent Configuration
  SupervisorAgentName:
    Type: String
    Default: SupervisorAgent
    Description: Name for the Supervisor/Router Agent
  
  SupervisorAgentFoundationModel:
    Type: String
    Default: us.anthropic.claude-3-5-haiku-20241022-v1:0
    Description: Foundation model for SupervisorAgent (Claude 3.5 Haiku for fast routing)
    AllowedValues:
      - us.anthropic.claude-3-5-haiku-20241022-v1:0

  SupervisorAgentInstruction:
    Type: String
    Default: |
      You are a simple and precise router agent. Your sole task is to analyze the user's text and determine their intent. You must return ONE of these three exact values: `PolicyAgent`, `VetDocAgent`, or `AgentNotFoundException`.

      Follow these rules STRICTLY:

      1.  If the text mentions insurance, an insurance policy, a car accident, a claim, or anything related to insurance, you must return `PolicyAgent`.
      2.  If the text describes symptoms of illness or a pet feeling unwell (e.g., a cat, dog, hamster), you must return `VetDocAgent`.
      3.  In all other cases, including greetings, thank you messages, or any other unrelated text, you must return `AgentNotFoundException`.

      **CRITICAL INSTRUCTIONS:**
      - Do not add any explanations.
      - Do not write anything other than one of the three specified values.
      - Your response must ALWAYS be just `PolicyAgent`, `VetDocAgent`, or `AgentNotFoundException`.

      Here are some examples:

      User: "My cat is lethargic and refuses to eat."
      Your Answer: VetDocAgent

      User: "Here is my policy id."
      Your Answer: PolicyAgent

      User: "Hello!"
      Your Answer: AgentNotFoundException

      User: "(any text about an insurance policy)"
      Your Answer: PolicyAgent

      User: "My dog has been vomiting since this morning."
      Your Answer: VetDocAgent

      User: "Thank you for your help."
      Your Answer: AgentNotFoundException

      Now, analyze the user's request below and provide your answer.

      User Request:
    Description: System instruction/prompt for SupervisorAgent routing logic
  
  SupervisorAgentIdleSessionTTL:
    Type: Number
    Default: 600
    MinValue: 60
    MaxValue: 3600
    Description: Idle session timeout in seconds for SupervisorAgent (60-3600)

Resources:
  SupervisorAgentRole:
    Type: AWS::IAM::Role
    Properties:
      # RoleName: !Sub '${AWS::StackName}-SupervisorAgentRole'
      Description: IAM role for SupervisorAgent to invoke Bedrock foundation models and route to other agents
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent/*'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonBedrockFullAccess
      Policies:
        - PolicyName: BedrockModelInvokePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/*'
        - PolicyName: BedrockAgentInvokePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeAgent
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent/*'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Agent
          Value: SupervisorAgent
        - Key: Role
          Value: Supervisor

  SupervisorAgent:
    Type: AWS::Bedrock::Agent
    Properties:
      AgentName: !Ref SupervisorAgentName
      Description: Supervisor agent with routing capabilities for Purrsurance system
      AgentResourceRoleArn: !GetAtt SupervisorAgentRole.Arn
      FoundationModel: !Ref SupervisorAgentFoundationModel
      Instruction: !Ref SupervisorAgentInstruction
      IdleSessionTTLInSeconds: !Ref SupervisorAgentIdleSessionTTL
      AutoPrepare: true
      Tags:
        Environment: !Ref Environment
        Service: SupervisorAgent
        ManagedBy: SAM
        Purpose: Routing

  SupervisorAgentAlias:
    Type: AWS::Bedrock::AgentAlias
    Properties:
      AgentId: !Ref SupervisorAgent
      AgentAliasName: !Sub '${Environment}-supervisor-alias'
      Description: !Sub 'Supervisor agent alias for ${Environment} environment'
      Tags:
        Environment: !Ref Environment
        Agent: SupervisorAgent
        Role: Supervisor

Outputs:
  SupervisorAgentId:
    Description: "SupervisorAgent Bedrock Agent ID"
    Value: !Ref SupervisorAgent
    Export:
      Name: !Sub '${AWS::StackName}-SupervisorAgentId'
  
  SupervisorAgentAliasId:
    Description: "SupervisorAgent Alias ID"
    Value: !GetAtt SupervisorAgentAlias.AgentAliasId
    Export:
      Name: !Sub '${AWS::StackName}-SupervisorAgentAliasId'
  
  SupervisorAgentArn:
    Description: "SupervisorAgent ARN"
    Value: !GetAtt SupervisorAgent.AgentArn
    Export:
      Name: !Sub '${AWS::StackName}-SupervisorAgentArn'
  
  SupervisorAgentRoleArn:
    Description: "SupervisorAgent IAM Role ARN"
    Value: !GetAtt SupervisorAgentRole.Arn
