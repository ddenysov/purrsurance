AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'tool-context-save

  Lambda function that saves contextual data (diagnosis, complaints, symptoms) to
  session context

  '
Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x
    Architectures:
    - x86_64
    LoggingConfig:
      LogFormat: JSON
Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
    - prod
    Description: Environment name
  EventPublisherStackName:
    Type: String
    Description: Name of the Event Publisher CloudFormation stack to get Events Table
      name
  EventPublisherUrl:
    Type: String
    Description: URL of the Event Publisher API endpoint for sending context events
  ChatHistoryTableName:
    Type: String
    Description: Name of the DynamoDB Chat History table
  LogLevel:
    Type: String
    Default: info
    AllowedValues:
    - error
    - warn
    - info
    - debug
    Description: Logging level
Resources:
  ContextEventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName:
        Fn::Sub: ${AWS::StackName}-context-events
      DisplayName: Context Events Topic
      Tags:
      - Key: Environment
        Value:
          Ref: Environment
      - Key: Service
        Value: tool-context-save
  ContextEventsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: lambda
      TopicArn:
        Ref: ContextEventsTopic
      Endpoint:
        Fn::ImportValue:
          Fn::Sub: ${EventPublisherStackName}-FunctionArn
  ContextEventsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Fn::ImportValue:
          Fn::Sub: ${EventPublisherStackName}-FunctionArn
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn:
        Ref: ContextEventsTopic
  SaveContextFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: SaveContextFunction
      Handler: app.lambdaHandler
      Description: Saves contextual data to session context for Bedrock Agent
      MemorySize: 256
      Environment:
        Variables:
          ENVIRONMENT:
            Ref: Environment
          EVENTS_TOPIC_ARN:
            Ref: ContextEventsTopic
          EVENT_PUBLISHER_URL:
            Ref: EventPublisherUrl
          CHAT_HISTORY_TABLE_NAME:
            Ref: ChatHistoryTableName
          LOG_LEVEL:
            Ref: LogLevel
          NODE_ENV: production
          AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
      Policies:
      - SNSPublishMessagePolicy:
          TopicName:
            Fn::GetAtt:
            - ContextEventsTopic
            - TopicName
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ChatHistoryTableName
    Metadata:
      SamResourceId: SaveContextFunction
  BedrockInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: SaveContextFunction
      Action: lambda:InvokeFunction
      Principal: bedrock.amazonaws.com
      SourceAccount:
        Ref: AWS::AccountId
      SourceArn:
        Fn::Sub: arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent/*
Outputs:
  SaveContextFunction:
    Description: Save Context Lambda Function ARN
    Value:
      Fn::GetAtt:
      - SaveContextFunction
      - Arn
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-FunctionArn
  SaveContextFunctionIamRole:
    Description: Implicit IAM Role created for Save Context function
    Value:
      Fn::GetAtt:
      - SaveContextFunctionRole
      - Arn
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-FunctionRoleArn
  ContextEventsTopicArn:
    Description: SNS Topic ARN for context events
    Value:
      Ref: ContextEventsTopic
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-ContextEventsTopicArn
  ContextEventsTopicName:
    Description: SNS Topic Name for context events
    Value:
      Fn::GetAtt:
      - ContextEventsTopic
      - TopicName
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-ContextEventsTopicName
